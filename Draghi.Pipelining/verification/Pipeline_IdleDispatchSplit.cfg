\* Lock-elision round, SPLIT level (July 2026) - THE adjudication. Same constants as
\* Pipeline_IdleDispatch.cfg, but the elision guard's reads and the activation are TWO
\* actions (SplitIdleDispatchGuard = TRUE): SourceYieldElideArm reads Count/latch/pending
\* and parks the item in DispatchArmed; SourceYieldElideAct activates with NO re-reads,
\* every other thread free to interleave between them - a callback can acquire the latch,
\* a drainer's post-release tail can reclaim, counts can move. This is the check-then-act
\* window the proposal's guard cannot close by construction (there is no lock to recheck
\* under), and the exact fidelity shape (SplitCPathExchange) that found the C-path's
\* production bug.
\*
\* A VIOLATION here is a FINDING: the elision is unsound as a check-then-act - report the
\* trace verbatim and which interleaving breaks it; do NOT weaken the model to force
\* green. The expected repair to then adjudicate is the depth-0 restriction (no in-flight
\* items at all => no waiter task exists whose callback could acquire the latch).
\* GREEN means the guard is stable even split - the single-producer structure (only the
\* executor commits work into the store, and it is the thread standing in the window)
\* leaves concurrent latch acquirers nothing to activate - and the code needs only
\* ordinary read-ordering care, no atomicity beyond the three loads.
