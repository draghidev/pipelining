\* Recovery inline-activate round (July 2026, the seam-audit adjudication). The two twin code
\* sites - RecoverItem (Pipeline.cs ~672-687) and RecoverCommittedTailWaiterAsync (~936-950) -
\* republish the substitute and inline-activate it on Count==0 with NO lock and NO _liveActivation
\* gate, while the advancer's C-path is live. DESIGN (Nino, July 2026): recovery ALWAYS
\* SUBSTITUTES - the substitute inherits the failed item's position INCLUDING its activation
\* state, so activate-over-faulted-predecessor is intended, NOT a double-grant bug. What is under
\* adjudication is the substitution WINDOW itself:
\*   Face 1: the substitute R activated TWICE (advancer C-path claim + the executor's ungated
\*           Count==0 arm) - ActivatedAtMostOnce's recovery-window face (uniform <= 1 under
\*           RecoverySplit); at the policy layer a double TryStart = 'already executing'.
\*   Face 2: mis-target mid-swap - the C-path's claim licensed against one item's world, its
\*           activate landing on the other (the republish is lock-free; the claim+read are one
\*           lock hold; the flag/field shadow pair explores the orderings).
\*   (b) vacuous-X: no two LIVE grants - ReadTurnMutex + AtMostOneLiveActivated (both exempt
\*       Recovering by the substitution semantics; they trip only if a displaced/live reader
\*       coexists).
\*   (c) turn conservation across substitution: EventuallyCompleted/EventuallyActivated +
\*       RecoveryCompletes (a stranded liveActivation through the swap strands the next item on
\*       the closed gate).
\* Base = Pipeline_CPathPreCheck.cfg (the shipped gate-round tree) + RecoverySplit = TRUE - a NEW
\* toggle combination (the recovery family was verified pre-gate-round on RecoveryWitness's set).
\* THIS CONFIG: the CONTROL - SplitRecoveryInlineAct = FALSE (the fused executor-wins-only fault
\* modeling; the post-mortem C-path grant unreachable). EXPECTED GREEN: establishes the new
\* RecoverySplit x gate-round combination is clean before the fidelity toggle opens the window.
