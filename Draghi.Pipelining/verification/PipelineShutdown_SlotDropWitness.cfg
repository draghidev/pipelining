\* Slot-serve protocol witness (run against PipelineShutdown.tla, SlotSpec): the
\* shipped DrainSlotInline release tail under shutdown. ServeDepositUnconditional =
\* FALSE -> the consumed deposit and the dirty-flag reclaim share one
\* !IsCancellationRequested gate, so a deposit consumed by ReleaseAndCheckPending
\* under Cancelled = TRUE is DROPPED. EXPECTED: EventuallyDrained VIOLATED - the
\* successor strands at "bailed" (latch free, drainSignal TRUE, nobody draining =
\* rider_wedge_post_pin.dmp). (MaxCallers / ExecutorClosesGate unused by SlotSpec.)
SPECIFICATION SlotSpec
CONSTANTS
    Cancelled = TRUE
    ServeDepositUnconditional = FALSE
    MaxCallers = 1
    ExecutorClosesGate = TRUE
    MaterializerTailUngated = TRUE
INVARIANT TypeOK
CHECK_DEADLOCK FALSE
PROPERTY EventuallyDrained
PROPERTY SweepQuiesces
