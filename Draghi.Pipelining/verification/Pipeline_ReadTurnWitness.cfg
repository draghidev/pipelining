\* Witness config for the read-turn mutex, June 2026.
\*
\* ReadTurnMutex = at most one flow holds the read turn at a time (one root, several faces:
\* ReadPromise TryStart "async method already executing", shared-decoder re-arm, _activatedItem
\* slot stomped to NoItem). ReadTurnMonitor sets readTurnStomped when an ACTIVATION moves the
\* slot off a still-live reader (live in BOTH pre- and post-state, so a single-path handoff -
\* AdvancerDrainHead completing the drained head as it activates the next - does NOT trip).
\*
\* This config sets CompleteBeforeCount = FALSE (ReorderFix OFF, the pre-fix DrainSlotInline
\* order) and EXPECTS ReadTurnMutex to FAIL: without the reorder the clear/activate race opens a
\* window where a second activation lands while the first turn is still live. ReorderFix is thus
\* LOAD-BEARING for the read turn.
\*
\* CONVERSELY, under the shipped Pipeline_Contract.cfg constants (CompleteBeforeCount = TRUE, all
\* other fixes on) ReadTurnMutex HOLDS over the full state space with NO _liveReaderActive-style
\* lock modeled - the existing guards already serialize the turn. (Verified: 2.6M states, no
\* violation.) That is the "which locks are load-bearing" result: at the Draghi layer the read
\* turn is already single under ReorderFix + the shipped guards.
CONSTANTS
  NumItems = 3
  WeakAdvancerRelease = FALSE
  WeakHasExecutingPublish = TRUE
  IsReferenceT = FALSE
  EmptySignalDeferred = TRUE
  NudgeEnabled = TRUE
  SlotReclaimEnabled = TRUE
  SlotChainActivation = TRUE
  SplitCountCommit = TRUE
  SkewTolerantPartition = TRUE
  PassOnceDrain = TRUE
  SignalConservation = TRUE
  CountGatedConservation = TRUE
  PendingWordLatch = TRUE
  SplitSlotFieldOps = TRUE
  TriStateSlotClaim = TRUE
  ModelCPathClear = TRUE
  CPathLeaveFix = TRUE
  SplitCallbackOps = FALSE
  SplitCPathExchange = FALSE
  SingleActivationGate = FALSE
  PeekGatedCPathLicense = FALSE
  QueueDPathCompletedGuard = FALSE
  LockFreeIdleDispatch = FALSE
  SplitIdleDispatchGuard = FALSE
  CPathPendingPreCheck = FALSE
  SplitCPathPreCheck = FALSE
  SplitCommitSelfActivate = FALSE
  CommitSelfActRecheck = FALSE
  SplitCommitSelfActRecheck = FALSE
  CommitSelfActVerify = FALSE
  CommitSelfActVerifyOnTaken = FALSE
  SplitRecoveryInlineAct = FALSE
  QueueTrailingFault = TRUE
  RecoverySplit = FALSE
  CompleteBeforeCount = FALSE  \* ReorderFix OFF: expect ReadTurnMutex to FAIL (load-bearing)
SPECIFICATION Spec
INVARIANT ReadTurnMutex
CHECK_DEADLOCK FALSE
