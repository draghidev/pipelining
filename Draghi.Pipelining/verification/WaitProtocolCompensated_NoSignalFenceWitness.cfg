\* Witness (historical): producer-side flag fence in the READ-THEN-CLAIM gate
\* world (pre-C5 code, where 672e1f45's Enqueue/Complete Interlocked was the
\* fix). The DROP path never fences, so the buffered flag is invisible to the
\* close-out's compensation read - lost wake, Drains violated. With the gate
\* under the lock (the clean config) this fence is subsumed by the claim's
\* acquire; this config documents why the pre-C5 code needed it. C5's own
\* violations (NoWrongThreadTake/HandoffInline) are deliberately not checked
\* here so the trace shows the fence loss, not the steal.
SPECIFICATION Spec
CONSTANTS
  MaxItems = 2
  CloseFence = TRUE
  SignalFence = FALSE
  OpenFence = TRUE
  GateUnderLock = FALSE
  PeekRecheck = TRUE
INVARIANTS
  TypeOK
PROPERTIES
  Drains
  AllConsumed
CHECK_DEADLOCK FALSE
