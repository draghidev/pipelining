\* Faithful config under TSO store-buffered publish (the loaded box). Confirms
\* publish/re-check staleness does not defeat the backstops: producer and pump
\* fence (AcquireWakeLock) before every re-check read.
SPECIFICATION Spec
CONSTANTS
  NSync = 2
  NAsync = 2
  G1 = TRUE
  G2 = TRUE
  G4 = TRUE
  G5 = TRUE
  G6 = TRUE
  G7 = TRUE
  G8 = TRUE
  LockThrough = TRUE
  PublishFence = FALSE
  AllowTrailing = TRUE
  FastPath = FALSE
  FastPathFence = TRUE
  IdleAtRelinquish = FALSE
INVARIANTS
  TypeOK
  SingleRunner
  OneDriver
  NoNullInvoke
  NoDoubleProc
  FifoSync
PROPERTIES
  AllProcessed
  SyncReturns
CHECK_DEADLOCK TRUE
