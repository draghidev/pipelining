\* Candidate FIX for the commit self-activate TOCTOU (Pipeline_CommitSelfActWitness.cfg).
\* CommitSelfActRecheck = TRUE: the activate step RE-READS taskDone at act time (an IsCompleted
\* re-read inside the lock, immediately before ActivateHeadItem, skipping the activation when the
\* task completed meanwhile). This SHRINKS but may not CLOSE the window - retirement still does
\* not take the lock, and the task can complete AFTER the re-check but before the activate. TLC
\* adjudicates whether the residual window is real at this granularity: a GREEN result says the
\* re-check suffices in the model; a violation's trace shapes a stronger fix (retirement clear
\* lock-serialized, or the activate verifying store residency).
\* Witness constants + CommitSelfActRecheck = TRUE.
CONSTANTS
  NumItems = 3
  WeakAdvancerRelease = FALSE
  WeakHasExecutingPublish = TRUE
  IsReferenceT = FALSE
  EmptySignalDeferred = TRUE
  NudgeEnabled = TRUE
  SlotReclaimEnabled = TRUE
  SlotChainActivation = TRUE
  SplitCountCommit = TRUE
  SkewTolerantPartition = TRUE
  PassOnceDrain = TRUE
  SignalConservation = TRUE
  CountGatedConservation = TRUE
  PendingWordLatch = TRUE
  SplitSlotFieldOps = TRUE
  TriStateSlotClaim = TRUE
  ModelCPathClear = TRUE
  CPathLeaveFix = TRUE
  SplitCallbackOps = FALSE
  SplitCPathExchange = TRUE
  SingleActivationGate = TRUE
  PeekGatedCPathLicense = TRUE
  QueueDPathCompletedGuard = TRUE
  LockFreeIdleDispatch = TRUE
  SplitIdleDispatchGuard = FALSE
  RecoverySplit = FALSE
  CompleteBeforeCount = TRUE
  ConsumableTaskTokens = FALSE
  CommitOwnershipRestructure = FALSE
  RestructureWireBeforePublish = FALSE
  CPathPendingPreCheck = TRUE
  SplitCPathPreCheck = FALSE
  SplitCommitSelfActivate = TRUE
  CommitSelfActRecheck = TRUE       \* the fix: re-read IsCompleted inside the lock before activate
  SplitCommitSelfActRecheck = FALSE
  CommitSelfActVerify = FALSE
  CommitSelfActVerifyOnTaken = FALSE
  SplitRecoveryInlineAct = FALSE
  QueueTrailingFault = TRUE
SPECIFICATION Spec
INVARIANT Invariants
INVARIANT ActivatedAtMostOnce
INVARIANT ReadTurnMutex
PROPERTY EventuallyCompleted
PROPERTY EventuallyActivated
CHECK_DEADLOCK FALSE
