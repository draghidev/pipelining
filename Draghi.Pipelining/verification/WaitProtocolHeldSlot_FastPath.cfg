\* FAST PATH clean (the adjudicated GREEN protocol): async producers skip the wake
\* lock when pumpWord reads Running (full fence between enqueue and the read); word
\* ->Running at every token mint, word->Idle fenced at REGISTRATION before the
\* OnSuspended HasItem recheck. Sync 2/2 + async 2, SC. Sync callers stay locked.
SPECIFICATION Spec
CONSTANTS
  NSync = 2
  NAsync = 2
  G1 = TRUE
  G2 = TRUE
  G4 = TRUE
  G5 = TRUE
  G6 = TRUE
  G7 = TRUE
  G8 = TRUE
  LockThrough = TRUE
  PublishFence = TRUE
  AllowTrailing = TRUE
  FastPath = TRUE
  FastPathFence = TRUE
  IdleAtRelinquish = FALSE
INVARIANTS
  TypeOK
  SingleRunner
  OneDriver
  NoNullInvoke
  NoDoubleProc
  FifoSync
PROPERTIES
  AllProcessed
  SyncReturns
CHECK_DEADLOCK TRUE
