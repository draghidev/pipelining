\* FIX PROOF (July 2026, gate round): the same-flow double activation pinned by
\* Pipeline_GateDoubleActWitness.cfg must be CLOSED. Same constants as the witness, PLUS
\* both fix toggles:
\*   - PeekGatedCPathLicense = TRUE: the queue C-path license requires the queue to be
\*     empty BY RESIDENCY, not merely count 0. Breaks the witness chain at its seed - the
\*     C-path can no longer fire past the resident completed-unactivated head (whose
\*     count increment has not landed), so the out-of-FIFO activation never happens and
\*     the retirement clear's "retiring item was the live one" assumption is restored.
\*     This is where the correctness weight rests: at-most-once by STRUCTURE (single
\*     license + FIFO), never by IsCompleted checks.
\*   - QueueDPathCompletedGuard = TRUE: the queue D-arm's IsCompleted skip (mirroring the
\*     slot D-path). Completed-at-commit items are drain-only by design - their tasks can
\*     complete long before activation reaches them (e.g. timeouts) - so the D-arm must
\*     not dispatch them. A dispatch-saver, NOT load-bearing for at-most-once (adjudicated
\*     by Pipeline_GateDoubleActFixNoGuard.cfg).
\*
\* EXPECTED: ActivatedAtMostOnce, ReadTurnMutex, and the full Invariants bundle all HOLD.
\* An ActivatedAtMostOnce violation here means the fix is insufficient - report the trace
\* verbatim as a finding; do NOT weaken anything to force green.
