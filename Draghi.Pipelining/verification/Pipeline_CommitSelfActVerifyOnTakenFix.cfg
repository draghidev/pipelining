\* PORTABILITY variant of the VERIFY fix (Pipeline_CommitSelfActVerifyFix.cfg): the trip keys on
\* "task-done AND taken" (slot: the Volatile slot-word snapshot no longer holds our item; queue:
\* the producer-side first==last emptiness read) instead of retirement (loc = Completed), because
\* retirement has no clean committer-observable in code. Trips EARLIER: also fires in the taken-
\* but-not-yet-completed drain window. Hand argument under adjudication: (1) a taken item is no
\* longer resident, so the NoNullWhileLive stomp face is gone; (2) the drain's own clear runs
\* after ours - double clear idempotent, no re-grant inside our hold; (3) grants serialize on the
\* lock. Suspect: the drain's clear is NOT inside our hold - after release, a successor grant can
\* land through the now-open gate BEFORE the drain's pending clear, which then stomps it.
\* EXPECTED (per the hand argument): GREEN on everything the verify-fix config checks. A RED
\* verdict maps the unsoundness and names the later observable the port must use instead.
\* VERDICT (July 2026): RED - NoNullWhileLive, 33-state trace, 544,122 distinct states. The
\* successor-grant suspect never fires (grant paths stay count-closed through the taken window);
\* the restore nulls the activated slot in the claimed-but-uncounted window (depth >= 1). The
\* sound observable is done /\ taken /\ count-re-read = 0 (VerifyCountZeroImpliesRetired).
