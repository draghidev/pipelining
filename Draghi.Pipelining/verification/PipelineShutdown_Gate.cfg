\* Gate protocol, fix on: the executor claims _completing before DisposeAsync, and
\* DisposeAsync gates on no in-flight Complete caller. NoCompleteAfterDispose and
\* ShutdownTerminates both hold. (Cancelled / ServeDepositUnconditional are the
\* slot-serve toggles, unused by GateSpec but assigned per TLC's all-constants rule.)
SPECIFICATION GateSpec
CONSTANTS
    MaxCallers = 2
    ExecutorClosesGate = TRUE
    Cancelled = FALSE
    ServeDepositUnconditional = TRUE
    MaterializerTailUngated = TRUE
INVARIANTS
    TypeOK
    NoCompleteAfterDispose
PROPERTIES
    ShutdownTerminates
