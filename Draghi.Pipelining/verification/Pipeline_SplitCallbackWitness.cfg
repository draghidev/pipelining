\* Backlog #3 race-granularity verification (June 2026): the fully-fixed tree (matches
\* Pipeline_Contract.cfg) PLUS the un-fused queue callback (SplitCallbackOps = TRUE). The
\* fused CallbackBecomesAdvancer/BailsOut collapse the callback's `_drainSignal = true` store,
\* its TryAcquireOrFlagPending, and the pass-top clear into one atomic action. This splits the
\* store from the acquire (callbackSignaled tracks the set-before-acquire transient), so two
\* concurrent callbacks' stores and a concurrent advancer's pass-top clear interleave against
\* it - the case the fusion hides.
\*
\* EXPECTED GREEN: EventuallyActivated + EventuallyCompleted + all safety invariants hold.
\* That converts the manual enumeration (every signal-set is deposit-paired or the
\* materializing-token, both already verified) into a checked fact: the deposit carries the
\* wake even when a sibling's pass-top clear wipes the signal mid-window. If VIOLATED, a path
\* leans on the signal in a way the deposit does not cover - a real concurrent-callback strand.
