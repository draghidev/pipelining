\* WITNESS - EXPECTED VIOLATION of ActivatedAtMostOnce (July 2026, gate round finding).
\*
\* Same-flow double activation, a residual face the _liveActivation gate does NOT close
\* (distinct from the two-flow read-turn collision, which it does - see
\* Pipeline_GateReadTurn.cfg). The 28-state trace:
\*
\*   1. Item 2's waiter task completes UNACTIVATED before its commit (the
\*      completed-before-commit face). Its commit's IsCompleted skip leaves it
\*      committed-unactivated at the queue head; the gate stays OPEN (nothing is live,
\*      the item never activated).
\*   2. Item 3 is deferred-published (pending set). The queue C-path's license reads
\*      Count = 0 - the count UNDER-PROMISES the store (a commit's enqueue precedes its
\*      increment), so the license passes while completed item 2 is resident at the head.
\*      Gate open, pending set: the C-path fires and activates item 3 OUT OF FIFO ORDER,
\*      ahead of queued item 2.
\*   3. The advancer drains completed item 2. Its retirement runs CompleteWaiterDeferred,
\*      whose idempotent _liveActivation clear (argued safe by "head-ordered retirement +
\*      one-live-activation") wrongly RELEASES item 3's live turn: the retiring item never
\*      held it.
\*   4. The ungated D-arm (count > 0 after the decrement) activates the new head = item 3
\*      A SECOND TIME. activations = <<1, 0, 2>>.
\*
\* Production face: double ActivateHeadItem on one flow = a second TryStart on its shared
\* read promise ("The async method is already executing"). Rarer than the original
\* collision: needs a completed-before-commit waiter inside the armed C-path window.
\* Two broken assumptions compound: the D-arm's "FIFO head is never live" (broken by the
\* out-of-FIFO C-path fire) and the retirement clear's "retiring item was the live one"
\* (broken by a completed-unactivated retiree).
