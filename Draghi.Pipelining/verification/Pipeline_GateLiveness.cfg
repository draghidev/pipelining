\* THE question (July 2026, gate round): can a gate-skip strand an activation?
\*
\* All shipped fixes ON plus the shipped _liveActivation single-activation gate
\* (SingleActivationGate = TRUE). The gate closes the site-20/site-25 read-turn collision
\* by SKIPPING two activation sites when an activation is live:
\*   (1) CommitWaiter's wasEmpty self-activate leaves the item committed-unactivated, on the
\*       coverage claim "the advancer activates it in FIFO order when the live reader retires";
\*   (2) the queue C-path leaves the pending publish in place, on the coverage claim "this
\*       C-path re-fires in the same advancer pass" after the retirement clears the bit.
\* NEITHER claim has ever been verified - this config makes EventuallyActivated adjudicate
\* them over the full fixed tree. This is the live suspect for a rare real-world strand.
\*
\* A violation of EventuallyActivated here is a FINDING (a real-bug candidate trace), NOT a
\* modeling error - report the trace verbatim; do NOT "fix" the model to make it pass.
