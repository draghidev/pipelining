\* Recovery round, Phase A (June 2026, backlog #2/#5): the fully-fixed tree (matches
\* Pipeline_Contract.cfg) PLUS the distinct-identity recovery (RecoverySplit = TRUE). The failed
\* item parks in "Recovering" carrying a completion obligation; a fresh substitute (recoveryOf[j]
\* = i) flows the normal lifecycle; BindingDischarge completes the failed item when the substitute
\* completes. Injection points covered: Phase A first-level Executing-throw (ExecItemFailure);
\* Phase B policy-refuse (RecoverRefuse) + recovery-on-recovery (RecoverOnRecoveryFails);
\* Phase C trailing fault on a committed QUEUE waiter (DrainHeadRecovers); Phase D trailing
\* fault on a committed SLOT waiter (SlotHeadRecovers - parks at the GetResult point as
\* "RecoveringInline" and resolves via the IN-PLACE lifecycle RecoverInstallInline /
\* RecoverInlineCompletes, the drain rejoining its standard count/complete steps afterwards)
\* + pre-faulted commit (ExecCommitTailRecovers). Mid-escalation Executing failure:
\* pre-failure the overlap is structurally empty (ExecutorQuiescentMidCommitPreFailure below
\* pins it); post-failure the substitute/executor overlap is real and the escPhase-agnostic
\* RecoverOnRecoveryFails covers it (see the invariant's comment). Still out:
\* partial-write-mid-frame, multi-failure (single SubSlot reservoir + failed = {} bound).
\*
\* EXPECTED GREEN: all safety invariants (incl. the UNIFORM ActivatedAtMostOnce <= 1 - the split
\* removes the failed-item slack, so a recovery double-activation would now violate it),
\* EventuallyCompleted + EventuallyActivated (substitutes activate and complete normally), and
\* RecoveryCompletes (the parked failed item discharges via the binding - the lifetime-alignment
\* guarantee, the original hang's shape). A violation is a stranded failed flow, a recovery
\* double-activation, or a binding the discharge misses.
