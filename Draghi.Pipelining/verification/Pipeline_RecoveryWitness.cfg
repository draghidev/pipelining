\* Recovery round, Phase A (June 2026, backlog #2/#5): the fully-fixed tree (matches
\* Pipeline_Contract.cfg) PLUS the distinct-identity recovery (RecoverySplit = TRUE). The failed
\* item parks in "Recovering" carrying a completion obligation; a fresh substitute (recoveryOf[j]
\* = i) flows the normal lifecycle; BindingDischarge completes the failed item when the substitute
\* completes. Phase A models the first-level Executing-throw failure only; recovery-on-recovery,
\* policy-refuse, and the other failure-injection points (trailing fault on a committed waiter,
\* pre-faulted at commit, mid-escalation) are later phases.
\*
\* EXPECTED GREEN: all safety invariants (incl. the UNIFORM ActivatedAtMostOnce <= 1 - the split
\* removes the failed-item slack, so a recovery double-activation would now violate it),
\* EventuallyCompleted + EventuallyActivated (substitutes activate and complete normally), and
\* RecoveryCompletes (the parked failed item discharges via the binding - the lifetime-alignment
\* guarantee, the original hang's shape). A violation is a stranded failed flow, a recovery
\* double-activation, or a binding the discharge misses.
CONSTANTS
  NumItems = 3
  WeakAdvancerRelease = FALSE
  WeakHasExecutingPublish = TRUE
  IsReferenceT = FALSE
  EmptySignalDeferred = TRUE
  NudgeEnabled = TRUE
  SlotReclaimEnabled = TRUE
  ConsumeBeforeRepublish = TRUE
  SlotChainActivation = TRUE
  SplitCountCommit = TRUE
  SkewTolerantPartition = TRUE
  PassOnceDrain = TRUE
  SignalConservation = TRUE
  CountGatedConservation = TRUE
  PendingWordLatch = TRUE
  SplitSlotFieldOps = TRUE
  TriStateSlotClaim = TRUE
  ModelCPathClear = TRUE
  CPathLeaveFix = TRUE
  SplitCallbackOps = FALSE
  RecoverySplit = TRUE
SPECIFICATION Spec
INVARIANT Invariants
CHECK_DEADLOCK FALSE
INVARIANT NoTenureClash
INVARIANT BoundedCountSkew
INVARIANT NoNullActivation
PROPERTY EventuallyCompleted
PROPERTY EventuallyActivated
PROPERTY RecoveryCompletes
