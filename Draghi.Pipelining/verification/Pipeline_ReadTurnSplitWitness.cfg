\* Witness config for the read-turn collision through the SPLIT C-path (July 2026) - the
\* production bug's model witness. Every shipped fix is ON; the only delta from
\* Pipeline_ReadTurn.cfg is SplitCPathExchange = TRUE: the queue C-path's lock block is
\* modeled as its two real instructions (Count read = arm, pending Exchange + activate =
\* fire), with the executor free to interleave between them. The executor walks
\* commit(count 0->1, wasEmpty self-activate) + next-dispatch publish through the armed
\* window; the fire then consumes the FRESH publish - two flows granted the single-tenant
\* read turn. Matches the ConcurrentSyncAndAsync_RecordingReads soak signature (fast-threw,
\* holder via site 25, orphan via site 20, ~1/35 loops, July 2026).
\*
\* Expectation: ReadTurnMutex FAILS here. It must HOLD once the single-reader gate
\* (_liveReaderActive under _activationLock, both wasEmpty and C-path sides) is modeled.
