\* Witness: the window OPEN unfenced (the shipped code). EnqueueSyncWithHandoff
\* opens with Volatile.Write HandoffActive := TRUE (a release store, buffered),
\* while the close-out clear is Interlocked (full fence). A concurrent Complete
\* reads the window stale-CLOSED, claims the suspended wait the handoff is
\* rendezvousing on, and resolves Completed out from under it - the handoff
\* strands (HandoffReturns), or the steal runs the sync flow on the wrong
\* thread (NoWrongThreadTake). All other fixes ON, so the trace isolates the
\* open fence.
SPECIFICATION Spec
CONSTANTS
  MaxItems = 2
  CloseFence = TRUE
  SignalFence = FALSE
  OpenFence = FALSE
  GateUnderLock = TRUE
  PeekRecheck = TRUE
INVARIANTS
  TypeOK
  NoWrongThreadTake
  HandoffInline
PROPERTIES
  Drains
  AllConsumed
  HandoffReturns
CHECK_DEADLOCK FALSE
