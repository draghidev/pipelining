CONSTANTS
  NumItems = 3
  WeakAdvancerRelease = FALSE
  WeakHasExecutingPublish = TRUE
  IsReferenceT = FALSE
  EmptySignalDeferred = TRUE
  NudgeEnabled = TRUE
  SlotReclaimEnabled = TRUE
  ConsumeBeforeRepublish = TRUE
  SlotChainActivation = TRUE
  \* TRUE since the count-skew fix round (June 2026): the commit is modeled as its real
  \* enqueue-visible-then-increment split AND the skew-tolerant partition is on - Contract
  \* again means "the tree, truthfully modeled, green". BoundedCountSkew pins the
  \* single-producer -1 floor; NoNullActivation pins the D-arm canary.
  SplitCountCommit = TRUE
  SkewTolerantPartition = TRUE
  \* TRUE since the bail/recheck strand round: the truthful pass-once drain shape plus the
  \* SignalConservation repair (a pass that consumed the signal and drained nothing restores
  \* it at release; Pipeline_RecheckStrandWitness.cfg pins the unrepaired strand).
  PassOnceDrain = TRUE
  SignalConservation = TRUE
  \* The transient-hold strand fix pair (June 2026): dangle-free restores + the pending-word
  \* latch (the latch becomes a Drepper-style tri-state word; a bail's failed acquire deposits
  \* the obligation IN the word, the release Exchange reads it atomically and the releaser
  \* re-acquires to serve - obligation transfer, no kernel wait). Replaces the four refuted
  \* two-cell repair protocols (v1 retry livelock, v2 repeek, v3 serve-attempt, v4 T-cycle).
  \* Contract green over the full truthful model = the design target;
  \* Pipeline_RecheckStrandWitness.cfg pins the unfixed two-cell strand.
  CountGatedConservation = TRUE
  PendingWordLatch = TRUE
  \* The backlog #7 round (June 2026): the truthful slot field ops PLUS the tri-state fix -
  \* the slot word gains a consuming state (0/1/2, the latch's medicine applied to the slot),
  \* commits go data-then-license (fields before the publish; the slot CAS deleted), claims
  \* peek-then-CAS-then-consume under exclusive ownership, the escalation's move-claim is
  \* quiescent-only CAS. Pipeline_SlotTearWitness.cfg pins the unfixed tear (Tri FALSE).
  SplitSlotFieldOps = TRUE
  TriStateSlotClaim = TRUE
  \* The backlog #8 round (June 2026): the faithful C-path lock sequencing (the lock is its
  \* own phase reached by a <=0 decrement) PLUS the leave-at-Count>0 fix. The shipped clear
  \* (CPathLeaveFix=FALSE, Pipeline_CPathClearWitness.cfg) was proved to strand the published
  \* item - a real lost-activation bug, the slot double-skip in the queue. The fix leaves the
  \* won publish at Count>0 for the executor's commit to reclaim and activate.
  ModelCPathClear = TRUE
  CPathLeaveFix = TRUE
  SplitCallbackOps = FALSE
  RecoverySplit = FALSE
SPECIFICATION Spec
INVARIANT Invariants
CHECK_DEADLOCK FALSE
INVARIANT NoTenureClash
INVARIANT BoundedCountSkew
INVARIANT NoNullActivation
PROPERTY EventuallyCompleted
PROPERTY EventuallyActivated
