\* Gate protocol witness: without ExecutorClosesGate, an external CT cancellation can
\* drive the executor to disposing/done, then a CompleteAsync caller passes the
\* _completing CAS and calls _enumerator.Complete on a disposed CTS.
\* NoCompleteAfterDispose must fail. (Cancelled / ServeDepositUnconditional are
\* slot-serve toggles, unused by GateSpec but assigned per TLC's all-constants rule.)
SPECIFICATION GateSpec
CONSTANTS
    MaxCallers = 1
    ExecutorClosesGate = FALSE
    Cancelled = FALSE
    ServeDepositUnconditional = TRUE
    MaterializerTailUngated = TRUE
INVARIANTS
    TypeOK
    NoCompleteAfterDispose
