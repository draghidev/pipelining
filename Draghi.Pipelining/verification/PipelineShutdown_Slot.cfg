\* Slot-serve protocol contract (run against PipelineShutdown.tla, SlotSpec).
\* ServeDepositUnconditional = TRUE serves a consumed deposit unconditionally (hard
\* obligation handoff) and gates only the dirty-flag reclaim on cancellation -
\* mirroring DrainSlotInline's claim-fail path and DrainReadyWaiters' tail, which
\* already serve deposits unconditionally. Under Cancelled = TRUE (shutdown) every
\* committed successor still drains. EXPECTED: EventuallyDrained HOLDS.
\* (MaxCallers / ExecutorClosesGate are gate toggles, unused by SlotSpec but
\* assigned per TLC's all-constants rule.)
SPECIFICATION SlotSpec
CONSTANTS
    Cancelled = TRUE
    ServeDepositUnconditional = TRUE
    MaxCallers = 1
    ExecutorClosesGate = TRUE
    MaterializerTailUngated = TRUE
INVARIANT TypeOK
CHECK_DEADLOCK FALSE
PROPERTY EventuallyDrained
PROPERTY SweepQuiesces
