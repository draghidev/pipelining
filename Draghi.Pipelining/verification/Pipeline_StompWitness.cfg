\* Witness config for the activated-slot stomp race (June 2026):
\*   CompleteBeforeCount = FALSE models the pre-fix DrainSlotInline ordering
\*   (DecrementCount BEFORE CompleteWaiterDeferred). The decrement publishes
\*   the freed slot position to the executor's Count==0 inline-activation gate;
\*   a concurrent ActivateHeadItem (executor's deferred-publish branch, a
\*   successor commit's wasEmpty inline-activate, ...) writes activatedSlot
\*   = NEW; the subsequent unconditional clear in CompleteWaiterDeferred
\*   then stomps NEW back to NoItem. NEW's body's first decoder read sees
\*   NoItem and NREs (Slon's PgDecoder.CurrentExecutionControl, surfaced by
\*   Stress_SequentialReads_NoRecovery ~1/17 Pg-suite runs).
\*
\* Expectation: NoStompedActivation must FAIL here (witness) and must HOLD
\* under Pipeline_Contract.cfg (CompleteBeforeCount = TRUE, the shipped fix).
CONSTANTS
  NumItems = 3
  WeakAdvancerRelease = FALSE
  WeakHasExecutingPublish = TRUE
  IsReferenceT = FALSE
  EmptySignalDeferred = TRUE
  NudgeEnabled = TRUE
  SlotReclaimEnabled = TRUE
  SlotChainActivation = TRUE
  SplitCountCommit = TRUE
  SkewTolerantPartition = TRUE
  PassOnceDrain = TRUE
  SignalConservation = TRUE
  CountGatedConservation = TRUE
  PendingWordLatch = TRUE
  SplitSlotFieldOps = TRUE
  TriStateSlotClaim = TRUE
  ModelCPathClear = TRUE
  CPathLeaveFix = TRUE
  SplitCallbackOps = FALSE
  SplitCPathExchange = FALSE
  SingleActivationGate = FALSE
  PeekGatedCPathLicense = FALSE
  QueueDPathCompletedGuard = FALSE
  LockFreeIdleDispatch = FALSE
  SplitIdleDispatchGuard = FALSE
  CPathPendingPreCheck = FALSE
  SplitCPathPreCheck = FALSE
  SplitCommitSelfActivate = FALSE
  CommitSelfActRecheck = FALSE
  SplitCommitSelfActRecheck = FALSE
  CommitSelfActVerify = FALSE
  CommitSelfActVerifyOnTaken = FALSE
  SplitRecoveryInlineAct = FALSE
  QueueTrailingFault = TRUE
  RecoverySplit = FALSE
  CompleteBeforeCount = FALSE  \* witness toggle: pre-fix order, expect stomp
SPECIFICATION Spec
INVARIANT NoStompedActivation
CHECK_DEADLOCK FALSE
