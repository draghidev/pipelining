\* Queue-serve protocol contract (gap #2; PipelineShutdown.tla, QueueSpec). Under
\* shutdown (Cancelled = TRUE) with the drainer's dirty-flag recheck gated off, a
\* materializing item still drains because the materializing commit's OWN tail
\* (escalation nudge / inline OnWaiterTaskCompleted) is UNGATED
\* (MaterializerSelfServes = TRUE, shipped). EXPECTED: QEventuallyDrained HOLDS =
\* the queue's recheck-gating is gate-safe (no queue twin of the slot deposit-drop).
SPECIFICATION QueueSpec
CONSTANTS
    Cancelled = TRUE
    MaterializerTailUngated = TRUE
    ServeDepositUnconditional = TRUE
    MaxCallers = 1
    ExecutorClosesGate = TRUE
INVARIANT TypeOK
CHECK_DEADLOCK FALSE
PROPERTY QEventuallyDrained
