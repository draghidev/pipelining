\* Clean config: the shipped code at v2 fidelity (split arm/registration, lock-
\* through-OnCompleted), all guards faithful, sequential consistency. Sync caller-
\* handoff (2 sequential ops) + 2 concurrent async producers + the fault/trailing
\* off-park paths. The primary deliverable: all guards on => safety + liveness.
SPECIFICATION Spec
CONSTANTS
  NSync = 2
  NAsync = 2
  G1 = TRUE
  G2 = TRUE
  G4 = TRUE
  G5 = TRUE
  G6 = TRUE
  G7 = TRUE
  G8 = TRUE
  LockThrough = TRUE
  PublishFence = TRUE
  AllowTrailing = TRUE
  FastPath = FALSE
  FastPathFence = TRUE
  IdleAtRelinquish = FALSE
INVARIANTS
  TypeOK
  SingleRunner
  OneDriver
  NoNullInvoke
  NoDoubleProc
  FifoSync
PROPERTIES
  AllProcessed
  SyncReturns
CHECK_DEADLOCK TRUE
