\* STRONGER FIX for the commit self-activate residual (Pipeline_CommitSelfActResidualWitness.cfg).
\* CommitSelfActVerify = TRUE adds a third in-lock instruction VERIFY after FIRE: re-read taskDone;
\* if the item is now done, self-clear the just-planted grant (liveActivation -> FALSE, slot arm
\* restores activatedSlot to the depth-0 clear), idempotent with the drain's off-lock clear. The
\* spurious activations[i] bump at FIRE is ACCEPTED (not undone). Every re-grant path serializes on
\* the lock, so inside the hold only the drain's clear can interleave; the self-clear restores
\* exactly the state the drain's clear would have left, closing the residual window.
\* EXPECTED: GREEN (both safety and liveness). Non-vacuity is shown separately by
\* Pipeline_CommitSelfActVerifyProbe.cfg (VerifyTripBranchUnreached VIOLATED = the trip branch is
\* reached). ActivatedAtMostOnce / ReadTurnMutex asserted as the safety cross-check.
CONSTANTS
  NumItems = 3
  WeakAdvancerRelease = FALSE
  WeakHasExecutingPublish = TRUE
  IsReferenceT = FALSE
  EmptySignalDeferred = TRUE
  NudgeEnabled = TRUE
  SlotReclaimEnabled = TRUE
  SlotChainActivation = TRUE
  SplitCountCommit = TRUE
  SkewTolerantPartition = TRUE
  PassOnceDrain = TRUE
  SignalConservation = TRUE
  CountGatedConservation = TRUE
  PendingWordLatch = TRUE
  SplitSlotFieldOps = TRUE
  TriStateSlotClaim = TRUE
  ModelCPathClear = TRUE
  CPathLeaveFix = TRUE
  SplitCallbackOps = FALSE
  SplitCPathExchange = TRUE
  SingleActivationGate = TRUE
  PeekGatedCPathLicense = TRUE
  QueueDPathCompletedGuard = TRUE
  LockFreeIdleDispatch = TRUE
  SplitIdleDispatchGuard = FALSE
  RecoverySplit = FALSE
  CompleteBeforeCount = TRUE
  ConsumableTaskTokens = FALSE
  CommitOwnershipRestructure = FALSE
  RestructureWireBeforePublish = FALSE
  CPathPendingPreCheck = TRUE
  SplitCPathPreCheck = FALSE
  SplitCommitSelfActivate = TRUE
  CommitSelfActRecheck = TRUE
  SplitCommitSelfActRecheck = TRUE
  CommitSelfActVerify = TRUE         \* the stronger fix: VERIFY self-clears a stuck grant in-lock
  CommitSelfActVerifyOnTaken = FALSE
  SplitRecoveryInlineAct = FALSE
  QueueTrailingFault = TRUE
SPECIFICATION Spec
INVARIANT Invariants
INVARIANT ActivatedAtMostOnce
INVARIANT ReadTurnMutex
PROPERTY EventuallyCompleted
PROPERTY EventuallyActivated
CHECK_DEADLOCK FALSE
