\* WITNESS (expect RED / deadlock): word->Idle placed at RunLoop RELINQUISH instead
\* of at registration (IdleAtRelinquish=TRUE). Register keeps a runloop-owned turn
\* Running, so its HasItem recheck no longer follows the Idle store; a fast-path
\* return in the turn-end gap (word still Running, recheck already passed) records
\* neither token nor redrive, and the relinquish never re-peeks storage. THE
\* placement red - the design documentation for why Idle-at-registration is
\* the only sound spot.
SPECIFICATION Spec
CONSTANTS
  NSync = 2
  NAsync = 2
  G1 = TRUE
  G2 = TRUE
  G4 = TRUE
  G5 = TRUE
  G6 = TRUE
  G7 = TRUE
  G8 = TRUE
  LockThrough = TRUE
  PublishFence = TRUE
  AllowTrailing = TRUE
  FastPath = TRUE
  FastPathFence = TRUE
  IdleAtRelinquish = TRUE
INVARIANTS
  TypeOK
  SingleRunner
  OneDriver
  NoNullInvoke
  NoDoubleProc
  FifoSync
PROPERTIES
  AllProcessed
  SyncReturns
CHECK_DEADLOCK TRUE
