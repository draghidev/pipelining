\* wires the completion callback BEFORE publication, so the callback can raise the drain signal while
\* the item is not yet visible in the store (its own drain pass peeks nothing). RestructureWireBeforePublish
\* injects the conserved early deposit at the queue publish (drainSignal up + cbWiredPrePublish set as the
\* item lands resident-but-un-drained). EXPECTED: NoStaleTokenRead + EventuallyCompleted + EventuallyActivated
