\* Queue-serve witness (PipelineShutdown.tla, QueueSpec): the hypothetical where
\* the materializing item's ONLY servicer is the drainer's dirty-flag recheck
\* (MaterializerSelfServes = FALSE). Under Cancelled = TRUE that recheck is gated
\* off, so the item strands. EXPECTED: QEventuallyDrained VIOLATED. This is the
\* discriminator: it confirms the ungated materializer-tail (not the gated recheck)
\* is the load-bearing servicer - i.e. WHY the actual code (TRUE) is gate-safe.
SPECIFICATION QueueSpec
CONSTANTS
    Cancelled = TRUE
    MaterializerTailUngated = FALSE
    ServeDepositUnconditional = TRUE
    MaxCallers = 1
    ExecutorClosesGate = TRUE
INVARIANT TypeOK
CHECK_DEADLOCK FALSE
PROPERTY QEventuallyDrained
