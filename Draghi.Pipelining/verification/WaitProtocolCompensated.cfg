\* Clean config: the fixed code shape. Close-out clear fenced (C2), gate+claim
\* under one wake-lock hold (C5), queue-peek wait re-check (C6). SignalFence is
\* deliberately FALSE: the under-lock gate's acquire is itself the full fence
\* after the producer's flag store - either the gated claim runs before the
\* close-out's compensation read (committing the flag for it) or after the
\* clear's commit (the gate sees the window closed and claims directly) - so
\* the per-item Interlocked on Enqueue/Complete stores is provably redundant.
\* OpenFence = TRUE: the window OPEN is fenced (Interlocked), symmetric with the
\* close-out clear. The OpenFenceWitness shows the shipped Volatile.Write open
\* (OpenFence = FALSE) stranding the rendezvous.
SPECIFICATION Spec
CONSTANTS
  MaxItems = 2
  CloseFence = TRUE
  SignalFence = FALSE
  OpenFence = TRUE
  GateUnderLock = TRUE
  PeekRecheck = TRUE
INVARIANTS
  TypeOK
  NoWrongThreadTake
  HandoffInline
PROPERTIES
  Drains
  AllConsumed
  HandoffReturns
CHECK_DEADLOCK FALSE
