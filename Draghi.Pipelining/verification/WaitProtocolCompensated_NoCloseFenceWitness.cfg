\* Witness: close-out clear unfenced (the pre-672e1f45 shipped code). The
\* buffered clear keeps the window stale-open past the compensation reads: the
\* producer's gated claim defers against it while the close-out skips the wake
\* - lost wake, Drains violated. NOT subsumed by the under-lock gate (the
\* close-out's clear-then-read needs its own fence on its own thread).
SPECIFICATION Spec
CONSTANTS
  MaxItems = 2
  CloseFence = FALSE
  SignalFence = FALSE
  GateUnderLock = TRUE
  PeekRecheck = TRUE
INVARIANTS
  TypeOK
  NoWrongThreadTake
  HandoffInline
PROPERTIES
  Drains
  AllConsumed
  HandoffReturns
CHECK_DEADLOCK FALSE
