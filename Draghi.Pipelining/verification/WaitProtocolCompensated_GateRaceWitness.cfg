\* Witness: the shipped read-then-claim gate (audit C5). All store fences ON -
\* this is a pure interleaving hole, no weak memory required: the gate reads
\* window-closed before the open, the handoff opens/observes/acks, the stale
\* claim steals the wait, and the executor takes the acked handoff on a
\* scheduler thread - NoWrongThreadTake violated. (HandoffInline violates on
\* the sibling face of the same steal: the producer past its noop claim with
\* the flow still in the slot; this config checks the wrong-thread face so the
\* trace shows the flow actually crossing threads.)
SPECIFICATION Spec
CONSTANTS
  MaxItems = 2
  CloseFence = TRUE
  SignalFence = TRUE
  OpenFence = TRUE
  GateUnderLock = FALSE
  PeekRecheck = TRUE
INVARIANTS
  TypeOK
  NoWrongThreadTake
CHECK_DEADLOCK FALSE
