\* GUARD-INDEPENDENCE proof (July 2026, gate round): correctness must NOT lean on the
\* D-arm's IsCompleted guard. Same constants as Pipeline_GateDoubleActFix.cfg but with
\* QueueDPathCompletedGuard = FALSE - the racy limit where the check-then-activate
\* IsCompleted read ALWAYS loses (a task's completion is monotonic but asynchronous, so
\* any completed-head check is a TOCTOU; modeling the guard permanently absent is the
\* adversarial bound on every possible loss of that race).
\*
\* Design claim under test: at-most-once is delivered by STRUCTURE (the peek-gated
\* single license + FIFO drain order), and the D-arm guard is a dispatch-saver only -
\* it spares a pointless ActivateHeadItem on a drain-only item, it does not protect the
\* activation bound. EXPECTED: ActivatedAtMostOnce, ReadTurnMutex, Invariants all HOLD
\* with the guard absent. A violation here means correctness secretly leans on the guard
\* - a design-changing finding to report verbatim, NOT something to paper over.
CONSTANTS
  NumItems = 3
  WeakAdvancerRelease = FALSE
  WeakHasExecutingPublish = TRUE
  IsReferenceT = FALSE
  EmptySignalDeferred = TRUE
  NudgeEnabled = TRUE
  SlotReclaimEnabled = TRUE
  SlotChainActivation = TRUE
  SplitCountCommit = TRUE
  SkewTolerantPartition = TRUE
  PassOnceDrain = TRUE
  SignalConservation = TRUE
  CountGatedConservation = TRUE
  PendingWordLatch = TRUE
  SplitSlotFieldOps = TRUE
  TriStateSlotClaim = TRUE
  ModelCPathClear = TRUE
  CPathLeaveFix = TRUE
  SplitCallbackOps = FALSE
  SplitCPathExchange = TRUE
  SingleActivationGate = TRUE
  PeekGatedCPathLicense = TRUE  \* the load-bearing half, alone
  QueueDPathCompletedGuard = FALSE  \* the guard always loses its race
  LockFreeIdleDispatch = FALSE
  SplitIdleDispatchGuard = FALSE
  CPathPendingPreCheck = FALSE
  SplitCPathPreCheck = FALSE
  SplitCommitSelfActivate = FALSE
  CommitSelfActRecheck = FALSE
  SplitCommitSelfActRecheck = FALSE
  CommitSelfActVerify = FALSE
  CommitSelfActVerifyOnTaken = FALSE
  SplitRecoveryInlineAct = FALSE
  QueueTrailingFault = TRUE
  RecoverySplit = FALSE
  CompleteBeforeCount = TRUE
  ConsumableTaskTokens = FALSE
  CommitOwnershipRestructure = FALSE
  RestructureWireBeforePublish = FALSE
SPECIFICATION Spec
INVARIANT ActivatedAtMostOnce
INVARIANT ReadTurnMutex
INVARIANT Invariants
CHECK_DEADLOCK FALSE
