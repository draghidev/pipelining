\* BROKEN chain (adversarial staleness, no edge harvesting). Documents what
\* the fix does NOT claim: with acquire semantics voided, the stale-null
\* _next face and stale-equal _last empty verdicts remain available to the
\* adversary - the consumer no longer wrong-hops, but a pass can still
\* verdict a resident segment empty. Whatever TLC reports here scopes the
\* fix's guarantee to sound lowerings; it is not a shipped-code claim.
