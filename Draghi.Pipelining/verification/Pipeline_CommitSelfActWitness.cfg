\* The commit self-activate round (July 2026). Adjudicates a captured single-reader violation:
\* CommitWaiter's wasEmpty self-activate is TWO instructions with a lock boundary -
\*   wasEmpty = _waiters.Enqueue(item);           // increment; returns wasEmpty
\*   if (wasEmpty && !waiterTask.IsCompleted)      // IsCompleted checked OUTSIDE _activationLock
\*     lock (_activationLock)
\*       if (!_liveActivation) ActivateHeadItem(item);
\* SplitCommitSelfActivate = TRUE models the real split: the increment + wasEmpty/IsCompleted
\* CAPTURE is one action (ExecCommit*CountArm), the lock/gate/activate a following action
\* (ExecCommit*CountAct*) acting on the CAPTURED IsCompleted verdict with NO re-read (the gate
\* IS re-read fresh). Every other thread interleaves between them - in particular the item's
\* task completes, its callback acquires the advancer latch, the drain dequeues and RETIRES it
\* (CompleteWaiterDeferred's liveActivation clear is a drain-side write, NOT under the lock),
\* and THEN the commit's activation lands on the already-retired item: an activation with no
\* future retirement, liveActivation stuck TRUE.
\*
\* Full shipped constants (copied from Pipeline_CPathPreCheck.cfg, all fix toggles TRUE) plus
\* SplitCommitSelfActivate = TRUE as the ONLY split-fidelity toggle active, so any violation is
\* attributable to the commit self-activate TOCTOU alone. CommitSelfActRecheck = FALSE (shipped:
\* no re-read inside the lock). EXPECTED: a violation reproducing the theory (ReadTurnMutex, or a
\* liveness violation from the stuck turn, or a safety face). A violation is THE FINDING; a GREEN
\* result refutes the theory (the field capture has a different mechanism).
