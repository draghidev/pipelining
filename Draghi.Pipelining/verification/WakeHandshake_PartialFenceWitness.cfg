\* One edge fenced, one not (FenceA=TRUE, FenceB=FALSE). EXPECTED: NoLostWake
\* VIOLATED. Pins that a SINGLE fence is insufficient for the symmetric handoff -
\* the both-miss interleaving is still reachable when the un-fenced side's LOAD
\* hoists ahead of its STORE. This is why the #5 fix had to make BOTH writes
\* Interlocked.Exchange, not just one (the lesson the partial case encodes).
SPECIFICATION Spec
CONSTANTS
  FenceA = TRUE
  FenceB = FALSE
INVARIANT TypeOK
PROPERTY NoLostWake
CHECK_DEADLOCK FALSE
