\* Witness hunt for the slot field/flag race (backlog #7, June 2026 - the latent find from
\* reading WaiterStore.cs, never field-confirmed). Models the tree AS SHIPPED (all fix
\* toggles TRUE, matching Pipeline_Contract.cfg) with the slot tier's TRUTHFUL field ops:
\* commit = CAS-then-fields-then-increment (the license bit precedes the data - the inverse
\* of the SPSC fields-then-index discipline), claim = Exchange-then-read-then-clear, and the
\* reclaim entry stripped of its fused identity license (the code's gate is only
\* drainSignal + the latch win + the claim's own Exchange).
\*
\* Torn reads as such are EXPECTED (SPSC tears identically); the property under test is
\* that every claim returning TRUE is LICENSED - ordered after the fields of the pair it
\* returns. The suspected unlicensed reader is a stale-token reclaim whose claim Exchange
\* wins between a successor commit's _hasSlot CAS and its field writes.
\*
\* EXPECTED VIOLATED (CONFIRMED June 2026, 15-state trace in 1s): the reachable route is
\* the LICENSED CALLBACK PATH, no stale token needed - item 1's callback claims, the
\* Exchange lands, the executor commits item 2 into the freed flag (CAS + fields) before
\* the drainer's read; the read returns item 2 (the hijack - the drainer was woken for
\* item 1) and the clear WIPES item 2's fields under _hasSlot = 1 (next claim reads the
\* default pair - the NRE face; item 1 strands InSlot callback-spent). The license
\* argument's hole: callback wiring orders "my fields before my claim", but the Exchange
\* itself licenses the producer to re-write the cell before the read. Faces, in the order
\* TLC tends to find them: SlotConsistent / CountConsistency (the wipe), NoDefaultSlotClaim
\* (the default claim), EventuallyCompleted (the stranded victim). All must HOLD with
\* TriStateSlotClaim = TRUE (Pipeline_Contract.cfg, the fixed design).
CONSTANTS
  NumItems = 3
  WeakAdvancerRelease = FALSE
  WeakHasExecutingPublish = TRUE
  IsReferenceT = FALSE
  EmptySignalDeferred = TRUE
  NudgeEnabled = TRUE
  SlotReclaimEnabled = TRUE
  ConsumeBeforeRepublish = TRUE
  SlotChainActivation = TRUE
  SplitCountCommit = TRUE
  SkewTolerantPartition = TRUE
  PassOnceDrain = TRUE
  SignalConservation = TRUE
  CountGatedConservation = TRUE
  PendingWordLatch = TRUE
  SplitSlotFieldOps = TRUE
  \* FALSE pins the SHIPPED two-phase ops (Exchange-then-read-then-clear claim against the
  \* CAS-then-fields commit); the tri-state fix runs in Pipeline_Contract.cfg.
  TriStateSlotClaim = FALSE
  ModelCPathClear = FALSE
  CPathLeaveFix = FALSE
  SplitCallbackOps = FALSE
SPECIFICATION Spec
INVARIANT Invariants
CHECK_DEADLOCK FALSE
INVARIANT NoDefaultSlotClaim
INVARIANT NoTenureClash
INVARIANT BoundedCountSkew
INVARIANT NoNullActivation
PROPERTY EventuallyCompleted
PROPERTY EventuallyActivated
