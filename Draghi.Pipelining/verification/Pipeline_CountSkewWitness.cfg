\* Witness for the count-skew bug (June 2026, dump crash_22130.dmp + Debug assert
\* `count >= 0` fired under DeferredActivationUnderSustainedLoad_Stress). Models the tree
\* as shipped (all design fixes on) with the TRUTHFUL split commit: queue.Enqueue makes the
\* entry visible/consumable one step before Interlocked.Increment lands the count.
\* EXPECTED VIOLATIONS (verified June 2026, 15-state trace in 2s): StoreCountNonNegative
\* (a drain consumes the uncounted entry and DecrementCount goes to -1; reported first) and
\* NoNullActivation (same trace, downstream: the C/D partition misroutes -1 to the D-arm
\* whose unchecked TryPeek activates default(T) - the field NRE/exit-134; verifiable in
\* isolation by removing the StoreCountNonNegative line).
\* EventuallyActivated did NOT counterexample at NumItems = 3 (387k distinct states green
\* with the safety witnesses removed): the model's AdvancerCPath is a STANDING fair action,
\* so once the late increment heals the count to 0 fairness eventually claims the deferred
\* publish - but the real DrainReadyWaiters evaluates `count is 0` ONCE per drain pass and
\* a missed pass never re-runs. The quiet face (the 2s field completion timeout) therefore
\* needs drain-pass-once C-path granularity in the model before TLC can see it - fix-round
\* backlog, alongside the partition redesign itself.
\* Both safety witnesses must HOLD here once the count/queue partition is redesigned
\* against the split (at which point Contract flips SplitCountCommit = TRUE and this
\* config's expectation inverts to green).
CONSTANTS
  NumItems = 3
  WeakAdvancerRelease = FALSE
  WeakHasExecutingPublish = TRUE
  IsReferenceT = FALSE
  EmptySignalDeferred = TRUE
  NudgeEnabled = TRUE
  SlotReclaimEnabled = TRUE
  ConsumeBeforeRepublish = TRUE
  SlotChainActivation = TRUE
  SplitCountCommit = TRUE
  \* FALSE pins the SHIPPED partition (count == 0 as the C-path test); the fix lives in
  \* Pipeline_Contract.cfg with SkewTolerantPartition = TRUE.
  SkewTolerantPartition = FALSE
  PassOnceDrain = FALSE
  SignalConservation = FALSE
  CountGatedConservation = FALSE
  PendingWordLatch = FALSE
  SplitSlotFieldOps = FALSE
  TriStateSlotClaim = FALSE
  ModelCPathClear = FALSE
  CPathLeaveFix = FALSE
  SplitCallbackOps = FALSE
  RecoverySplit = FALSE
