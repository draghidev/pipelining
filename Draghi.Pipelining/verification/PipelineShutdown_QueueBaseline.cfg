\* Queue-serve baseline (PipelineShutdown.tla, QueueSpec): NOT shut down
\* (Cancelled = FALSE) and the materializer tail absent (MaterializerSelfServes =
\* FALSE) - so the drainer's dirty-flag recheck (ungated here) is the servicer.
\* EXPECTED: QEventuallyDrained HOLDS = the recheck is a valid servicer when not
\* gated, and the strand in the GatedWitness is attributable to shutdown alone.
SPECIFICATION QueueSpec
CONSTANTS
    Cancelled = FALSE
    MaterializerTailUngated = FALSE
    ServeDepositUnconditional = TRUE
    MaxCallers = 1
    ExecutorClosesGate = TRUE
INVARIANT TypeOK
CHECK_DEADLOCK FALSE
PROPERTY QEventuallyDrained
