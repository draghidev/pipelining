\* RESIDUAL of the commit self-activate fix (July 2026, follow-up round). The fused
\* CommitSelfActRecheck (Pipeline_CommitSelfActFix.cfg) modeled the in-lock IsCompleted re-read
\* and the ActivateHeadItem as ONE atomic action and came back GREEN. But in code the re-read
\* (Pipeline.cs:1134) and the activate (Pipeline.cs:1137) are SEPARATE instructions inside the
\* SAME lock hold (taken at Pipeline.cs:1127), and the drain's retirement clear (CompleteWaiter-
\* Deferred, Pipeline.cs:1087) is a lock-FREE write that can land BETWEEN them.
\* SplitCommitSelfActRecheck = TRUE splits ActFire into RECHECK (park the taskDone verdict) and
\* FIRE (activate on the CAPTURED verdict, gate re-read fresh). CommitSelfActVerify = FALSE: the
\* residual stands, no post-activate re-check. NoForeignGrant enforces the single-lock-hold
\* mutual exclusion (no foreign grant between RECHECK and FIRE); the drain's off-lock clear and
\* the task completion stay free to interleave - that IS the residual window.
\* EXPECTED: a LIVENESS violation reproducing the original strand shape - the item completes and
\* the drain retires it (liveActivation -> FALSE) between RECHECK and FIRE, the stale "fire"
\* verdict activates the retired item, liveActivation stuck TRUE (EventuallyActivated /
\* EventuallyCompleted lasso, safety intact). A GREEN result would say the window is unreachable
\* in the model - to be reported honestly, not massaged.
