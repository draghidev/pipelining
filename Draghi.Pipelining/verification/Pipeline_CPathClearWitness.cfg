\* Backlog #8 experiment (June 2026): the queue C-path lock block's clear-at-Count>0 branch
\* (DrainReadyWaiters ~1243). The fully-fixed tree (matches Pipeline_Contract.cfg) PLUS the
\* faithful clear arm (ModelCPathClear = TRUE): when the advancer wins the deferred-publish
\* Exchange but the under-lock Count re-read is >0, the code clears _executingItem WITHOUT
\* activating, trusting the D-path to activate the item as a queue head. Winning the Exchange
\* means the executor's own commit saw alreadyActivated and did NOT self-activate, so the
\* clear leaves NEITHER side activating - the slot double-skip's exact shape (the lost-
\* activation class that already falsified the analogous "believed sound" slot belief).
\*
\* ADJUDICATION: if EventuallyActivated and EventuallyCompleted HOLD over the full state
\* space, the D-path always covers the cleared item and the queue's clear-at-Count>0 is sound
\* (flip ModelCPathClear = TRUE in Pipeline_Contract.cfg to make it permanent). If either is
\* VIOLATED, the clear strands an item exactly as slot mode did - a real lost-activation bug,
\* and the trace shows the interleaving to fix (likely: the queue clear must also be deleted /
\* replaced by an activate, the slot-mode fix transplanted to the queue).
CONSTANTS
  NumItems = 3
  WeakAdvancerRelease = FALSE
  WeakHasExecutingPublish = TRUE
  IsReferenceT = FALSE
  EmptySignalDeferred = TRUE
  NudgeEnabled = TRUE
  SlotReclaimEnabled = TRUE
  ConsumeBeforeRepublish = TRUE
  SlotChainActivation = TRUE
  SplitCountCommit = TRUE
  SkewTolerantPartition = TRUE
  PassOnceDrain = TRUE
  SignalConservation = TRUE
  CountGatedConservation = TRUE
  PendingWordLatch = TRUE
  SplitSlotFieldOps = TRUE
  TriStateSlotClaim = TRUE
  ModelCPathClear = TRUE
  CPathLeaveFix = FALSE
  SplitCallbackOps = FALSE
SPECIFICATION Spec
INVARIANT Invariants
CHECK_DEADLOCK FALSE
INVARIANT NoTenureClash
INVARIANT BoundedCountSkew
INVARIANT NoNullActivation
PROPERTY EventuallyCompleted
PROPERTY EventuallyActivated
