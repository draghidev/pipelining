name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore Draghi.Pipelining.slnx
      - run: dotnet build Draghi.Pipelining.slnx -c Release --no-restore
      - run: dotnet test --project Draghi.Pipelining.Tests/Draghi.Pipelining.Tests.csproj -c Release --no-build --no-restore
      - run: verification/verify check
